<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Room — OKIZZ Entertainment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-auth-body">

<div class="admin-auth-cover">
  <div class="admin-auth-brand">
    <span class="admin-auth-logo"><i class="fa-solid fa-play"></i></span>
    <div>
      <p class="admin-auth-wordmark">OKIZZ <span>ENTERTAINMENT</span></p>
    </div>
  </div>
  <p class="admin-auth-kicker">CONTROL ROOM</p>
</div>

<main class="admin-auth-main">
  <div class="card admin-auth-card">
    <h2>Staff sign in</h2>
    <p class="admin-auth-sub">For OKIZZ team members only.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="admin-password-wrap">
          <input type="password" id="password" required autocomplete="current-password">
          <button type="button" class="admin-password-toggle" id="togglePassword" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <p class="error-text" id="loginError" style="display:none;"></p>

      <button type="submit" class="btn btn-primary admin-auth-submit" id="submitBtn">Sign in</button>
    </form>
  </div>

  <p class="admin-auth-note"><i class="fa-solid fa-shield-halved"></i> Sessions end when you close this tab.</p>
</main>

<script src="../js/api.js"></script>
<script src="../js/admin/auth.js"></script>
</body>
</html>
